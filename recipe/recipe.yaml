schema_version: 1

context:
  version: "0.14.1"

package:
  name: nilearn
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/n/nilearn/nilearn-${{ version }}.tar.gz
  sha256: 6f7ec639be2c9e4a3625ebc4f25c3de31ae3af21331c8d03e27201c482609672

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - setuptools-scm !=9.0.0
    - pip
  run:
    - python >=${{ python_min }}
    - joblib >=1.2.0
    - nibabel >=5.2.0
    - numpy >=1.26.0
    - pandas >=2.3.0
    - requests >=2.33.0
    - scikit-learn >=1.5.0,!=1.7.0,!=1.9.0
    - jinja2 >=3.1.6
    - scipy >=1.11.1
    - packaging >=26.0.0

tests:
  - python:
      imports:
        - nilearn
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Statistical learning for neuroimaging in Python
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://nilearn.github.io

extra:
  recipe-maintainers:
    - ocefpaf
    - GaelVaroquaux
    - KamalakerDadi
